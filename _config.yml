title: Arachne
description: "A Gaming Podcast — episodes, events, videos, and community updates."
url: "https://arachneapodcast.com"
baseurl: ""

# Monetization is intentionally disabled until real account values are added.
# Example AdSense value: ca-pub-1234567890123456
adsense_client: ""

# Add the full Ko-fi (or other payment provider) URL when the page is ready.
support_url: "https://ko-fi.com/arachneapodcast"

# Permanent community invite used on the Contact page.
discord_url: "https://discord.gg/UAMNqPCJM"

# IMPORTANT: remove theme so we use our own layouts
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
permalink: /posts/:title/

collections:
  sponsors:
    output: false

# Authoring examples are source-only and should never become public pages.
exclude:
  - README.md
  - templates
  - vendor
